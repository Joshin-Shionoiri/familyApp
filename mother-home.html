<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お母さんホーム</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #FF8A80;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #FF8A80;
      color: white;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      margin-top: 10px;
    }
    .btn:hover {
      background: #ff7a70;
    }
    .event-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .event-item:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

  <header>お母さんのホーム</header>

  <div class="container">

    <!-- 今日のひとこと -->
    <div class="card">
      <h2>今日のひとこと</h2>
      <p id="todayMessage">読み込み中…</p>
    </div>

    <!-- 今日の予定（今回追加した部分） -->
    <div class="card">
      <h2>今日の予定</h2>
      <div id="todaySchedule">読み込み中…</div>
    </div>

    <!-- メッセージ一覧 -->
    <div class="card">
      <h2>メッセージ</h2>
      <div id="messageList">読み込み中…</div>
      <a class="btn" href="messages.html">もっと見る</a>
    </div>

    <!-- マッサージ券 -->
    <div class="card">
      <h2>マッサージ券</h2>
      <a class="btn" href="massage.html">券を見る</a>
    </div>

    <!-- ストレッチ動画 -->
    <div class="card">
      <h2>ストレッチ</h2>
      <a class="btn" href="stretch.html">動画を見る</a>
    </div>

    <!-- フォトフレーム -->
    <div class="card">
      <h2>フォトフレーム</h2>
      <a class="btn" href="photos.html">写真を見る</a>
    </div>

    <!-- カレンダー -->
    <div class="card">
      <h2>カレンダー</h2>
      <a class="btn" href="calendar.html">予定を見る</a>
    </div>

    <a class="btn" href="index.html">ログアウト</a>

  </div>

  <script src="js/mother-home.js"></script>

</body>
</html>
<a class="btn" onclick="logout()">ログアウト</a>
