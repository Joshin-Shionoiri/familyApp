<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>家族アプリ ログイン</title>

  <style>
    body {
      font-family: "Hiragino Sans", sans-serif;
      background: linear-gradient(135deg, #A5D6A7, #81C784);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      width: 90%;
      max-width: 380px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 20px;
      color: #4CAF50;
      font-size: 26px;
    }

    .user-select-box {
      margin: 20px 0;
      text-align: left;
    }

    label {
      font-size: 14px;
      color: #555;
    }

    select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 8px;
      background: #fafafa;
      transition: 0.2s;
    }

    select:hover {
      border-color: #4CAF50;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button:hover {
      background: #43a047;
      transform: translateY(-2px);
    }

    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 10px;
      font-size: 40px;
      color: #4CAF50;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="icon">👪</div>
    <h1>家族アプリ</h1>

    <div class="user-select-box">
      <label>ログインするユーザーを選んでください</label>
      <select id="userSelect">
        <option value="mother">お母さん</option>
        <option value="father">お父さん</option>
        <option value="sister">妹</option>
        <option value="joshin">JOSHIN</option>
      </select>
    </div>

    <button onclick="login()">ログイン</button>
  </div>

  <script>
    function login() {
      const user = document.getElementById("userSelect").value;

      // ログインユーザーを保存
      localStorage.setItem("loginUser", user);

      // ユーザーごとのホームに移動
      switch (user) {
        case "mother":
          location.href = "mother-home.html";
          break;
        case "father":
          location.href = "father-home.html";
          break;
        case "sister":
          location.href = "sister-home.html";
          break;
        case "joshin":
          location.href = "admin-home.html";
          break;
      }
    }
  </script>

</body>
</html>
