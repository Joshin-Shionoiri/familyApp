<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Family Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 最低限の見た目（style.cssがなくても動くように） */
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>Family Login</h2>
    <p>家族キーを入力してください</p>

    <input id="keyInput" type="password" placeholder="例: MOTHER-KEY-2025">
    <button onclick="login()">ログイン</button>

    <div id="error" class="error">キーが違います</div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
