<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マッサージ券を使う</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #ff7f9f;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    #qrcode {
      margin: 20px auto;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #ff7f9f;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      margin-top: 10px;
    }
    .btn:hover {
      background: #ff6a8c;
    }
    #usedMessage {
      font-size: 20px;
      color: #444;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>

<body>

  <header>マッサージ券を使う</header>

  <div class="container">

    <div class="card">
      <h2>このQRコードをJOSHINに見せてね</h2>
      <div id="qrcode"></div>
      <p id="ticketInfo">読み込み中…</p>
    </div>

    <a class="btn" href="mother-home.html">戻る</a>

    <p id="usedMessage">ありがとう！マッサージ券を使いました。</p>

  </div>

  <script src="js/qrcode.min.js"></script>
  <script src="js/tickets.js"></script>

</body>
</html>
