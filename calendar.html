<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>家族カレンダー</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .event-item {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }
    .event-item:last-child {
      border-bottom: none;
    }
    .btn {
      display: inline-block;
      padding: 8px 12px;
      background: #4CAF50;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      margin-top: 10px;
    }
    .btn:hover {
      background: #43a047;
    }
  </style>
</head>

<body>

  <header>家族カレンダー</header>

  <div class="container">

    <div class="card">
      <h2>今日の予定</h2>
      <div id="todayEvents">読み込み中…</div>
    </div>

    <div class="card">
      <h2>今週の予定</h2>
      <div id="weekEvents">読み込み中…</div>
    </div>

    <div class="card">
      <h2>予定一覧</h2>
      <div id="allEvents">読み込み中…</div>
    </div>

    <a class="btn" href="calendar-add.html">予定を追加する</a>
    <a class="btn" href="admin-home.html">ホームに戻る</a>

  </div>

  <script src="js/calendar.js"></script>

</body>
</html>
