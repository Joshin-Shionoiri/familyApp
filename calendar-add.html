<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>予定を追加する</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-top: 10px;
    }
    textarea {
      height: 100px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn:hover {
      background: #43a047;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>

<body>

  <header>予定を追加する</header>

  <div class="container">

    <div class="card">
      <h2>新しい予定</h2>

      <label>日付</label>
      <input type="date" id="eventDate">

      <label>タイトル</label>
      <input type="text" id="eventTitle" placeholder="例：病院の予約">

      <label>詳細（任意）</label>
      <textarea id="eventDetail" placeholder="例：14:00 内科"></textarea>

      <label>登録者</label>
      <select id="eventFrom">
        <option value="mother">お母さん</option>
        <option value="father">お父さん</option>
        <option value="sister">妹</option>
        <option value="joshin">JOSHIN</option>
      </select>

      <button class="btn" onclick="addEvent()">予定を追加する</button>

      <p id="status"></p>
    </div>

    <a class="btn" href="calendar.html">カレンダーに戻る</a>
    <a class="btn" href="admin-home.html">ホームに戻る</a>

  </div>

  <script src="js/calendar-add.js"></script>

</body>
</html>
