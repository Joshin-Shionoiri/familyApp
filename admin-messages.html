<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メッセージ送信（管理者）</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-top: 10px;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-top: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn:hover {
      background: #43a047;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>

<body>

  <header>メッセージ送信（管理者）</header>

  <div class="container">

    <div class="card">
      <h2>メッセージを送る</h2>

      <label>送り先</label>
      <select id="target">
        <option value="mother">お母さん</option>
        <option value="sister">妹</option>
        <option value="father">お父さん</option>
        <option value="all">家族全員</option>
      </select>

      <textarea id="messageText" placeholder="メッセージを入力…"></textarea>

      <button class="btn" onclick="sendAdminMessage()">送信</button>

      <p id="status"></p>
    </div>

    <a class="btn" href="admin-home.html">管理者ホームに戻る</a>

  </div>

  <script src="js/admin-messages.js"></script>

</body>
</html>
